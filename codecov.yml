# Every Codecov check is informational by design (ADR 0004, workspace root): the test runs in CI are
# the gates, and Codecov's free tier does not contractually guarantee feature availability, so a
# failing Codecov check must never block a merge. Only the default project and patch statuses are
# configured, both pinned informational. Flag-scoped status checks are deliberately not configured:
# `flag_management` statuses have no `informational` option, so they could block a merge. The
# per-flag numbers stay visible via the PR comment (flags section) and the per-flag badges (README).
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
flag_management:
  default_rules:
    carryforward: false
comment:
  # the flags section is where the `unit` / `integration` flag numbers show up in the PR comment
  layout: "diff, flags, files"
