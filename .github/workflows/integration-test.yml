name: Integration Tests

# Called from the Build & Test workflow so that `needs:` can order it after the unit tests - `needs:`
# does not work across workflows, and a separately triggered workflow would run in parallel instead.
on:
  workflow_call:

jobs:
  # One matrix leg per package in the int-test/ workspace group. Adding another test server (ASP.NET,
  # Java, ...) means adding its package plus one entry here - no language-specific toolchain is ever
  # needed in this repo, since every server is consumed as a Docker image.
  #
  # examples/* are absent here: their test suites are optional demonstrations, not the safety net -
  # no CI stage runs them, and the aggregate unit run excludes `examples/**` entirely (root
  # vite.config.ts).
  integration-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest # Docker is preinstalled, which testcontainers needs
    strategy:
      # one server being unavailable should not hide the results of the others
      fail-fast: false
      matrix:
        include:
          - name: cap
            package: "@odata2ts/int-test-cap"
          - name: asp-net
            package: "@odata2ts/int-test-asp-net"
          - name: olingo-v2
            package: "@odata2ts/int-test-olingo-v2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install packages
        run: yarn --immutable
      # also generates the client of the int-test package - offline, from the committed metadata
      - name: Build packages
        run: yarn build
      # the single instrumented run per suite: the tests plus `int-test/<name>/coverage/`, which feeds
      # the `integration` coverage flag (ADR 0004, workspace root)
      - name: Run integration tests with coverage
        run: yarn workspace ${{ matrix.package }} coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: int-coverage-${{ matrix.name }}
          path: int-test/${{ matrix.name }}/coverage/
      # non-blocking by design (the action's `fail_ci_if_error` defaults to false): the tests above
      # are the gate, this step only publishes the coverage report
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: int-test/${{ matrix.name }}/coverage/lcov.info
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
