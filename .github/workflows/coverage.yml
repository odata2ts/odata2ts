name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  test:
    name: Unit Tests With Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install packages
        run: yarn --immutable
      - name: Check dependency consistency
        run: yarn constraints
      - name: Build packages
        run: yarn build
      - name: Type Test
        run: yarn test-compile
      - name: Check formatting
        run: yarn check-format
      - name: Check Circular Deps
        run: yarn check-circular-deps
      - name: Run Tests
        run: yarn coverage
      # non-blocking by design (the action's `fail_ci_if_error` defaults to false): the tests above
      # are the gate, this step only publishes the `unit` coverage flag (ADR 0004, workspace root)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

  static-int-tests:
    name: Static Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install packages
        run: yarn --immutable
      - name: Build packages
        run: yarn build
      - name: Verify generated output type-checks under the declared minimum TypeScript version
        working-directory: int-test/ts-floor-check
        run: yarn test
      # the single instrumented run: the CLI tests plus `int-test/cli/coverage/`, which feeds the
      # `integration` coverage flag alongside the server suites (ADR 0004, workspace root)
      - name: Verify CLI works
        working-directory: int-test/cli
        run: yarn coverage
      - name: Upload CLI coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: int-coverage-cli
          path: int-test/cli/coverage/
      # non-blocking by design (the action's `fail_ci_if_error` defaults to false)
      - name: Upload CLI coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: int-test/cli/coverage/lcov.info
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}

  # Container-based integration tests against real OData servers. By far the most expensive part of the
  # pipeline, so they only start once the unit tests are green. They live in their own workflow file and
  # are pulled in here, because `needs:` cannot order across workflows.
  container-int-test:
    name: Container Integration Tests
    needs: test
    uses: ./.github/workflows/integration-test.yml
