name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  test:
    name: Unit Tests With Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install packages
        run: yarn --immutable
      - name: Build packages
        run: yarn build
      - name: Type Test
        run: yarn test-compile
      - name: Check formatting
        run: yarn check-format
      - name: Check Circular Deps
        run: yarn check-circular-deps
      - name: Run Tests
        run: yarn coverage
      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  static-int-tests:
    name: Static Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install packages
        run: yarn --immutable
      - name: Build packages
        run: yarn build
      - name: Verify generated output type-checks under the declared minimum TypeScript version
        working-directory: int-test/ts-floor-check
        run: yarn test
      - name: Verify CLI works
        working-directory: int-test/cli
        run: yarn test

  # Container-based integration tests against real OData servers. By far the most expensive part of the
  # pipeline, so they only start once the unit tests are green. They live in their own workflow file and
  # are pulled in here, because `needs:` cannot order across workflows.
  container-int-test:
    name: Container Integration Tests
    needs: test
    uses: ./.github/workflows/integration-test.yml
