name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  test:
    name: Unit Tests With Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install packages
        run: yarn --immutable
      - name: Build packages
        run: yarn build
      - name: Type Test
        run: yarn test-compile
      - name: Check Circular Deps
        run: yarn check-circular-deps
      - name: Run Tests
        run: yarn coverage
      - name: Coveralls
        uses: coverallsapp/github-action@v1.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  int-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install packages
        run: yarn --immutable
      - name: Build packages
        run: yarn build
      - name: Run integration tests against the live OData services
        run: yarn workspace @odata2ts/example-main int-test

  ts-floor-check:
    name: TypeScript Floor Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install packages
        run: yarn --immutable
      - name: Build packages
        run: yarn build
      - name: Install floor TypeScript version
        working-directory: examples/ts-floor-check
        run: yarn install-floor-ts
      - name: Verify generated output type-checks under the declared minimum TypeScript version
        working-directory: examples/ts-floor-check
        run: yarn int-test

  # Container-based integration tests against real OData servers. By far the most expensive part of the
  # pipeline, so they only start once the unit tests are green. They live in their own workflow file and
  # are pulled in here, because `needs:` cannot order across workflows.
  container-int-test:
    name: Container Integration Tests
    needs: test
    uses: ./.github/workflows/integration-test.yml
